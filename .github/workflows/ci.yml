name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node scripts/build-user-manual.mjs --check
      - run: npm test
      - run: npm run demo

  desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run build
      - name: Run Windows acceptance and create candidate bundle
        run: node --experimental-sqlite scripts/acceptance.mjs --output-name ci-${{ github.run_id }}-${{ github.run_attempt }} --soak-seconds 60
      - name: Upload sanitized acceptance report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release/ci-${{ github.run_id }}-${{ github.run_attempt }}/report.json
            .release/ci-${{ github.run_id }}-${{ github.run_attempt }}/report.md
          if-no-files-found: ignore
      - name: Upload verified candidate bundle from a push
        if: success() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/ci-${{ github.run_id }}-${{ github.run_attempt }}/bundle/
          if-no-files-found: error
          compression-level: 0
