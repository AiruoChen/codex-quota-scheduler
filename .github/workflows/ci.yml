name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run demo

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run package:desktop
      - run: node scripts/package-installer.mjs
      - run: node --experimental-sqlite scripts/smoke-desktop.mjs --packaged .release/desktop/CodexQuotaScheduler-win32-x64/CodexQuotaScheduler.exe
      - run: node --experimental-sqlite scripts/smoke-lifecycle.mjs --packaged .release/desktop/CodexQuotaScheduler-win32-x64/CodexQuotaScheduler.exe
      - run: node --experimental-sqlite scripts/smoke-installer.mjs --package .release/desktop/CodexQuotaScheduler-win32-x64
      - name: Upload sanitized desktop diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/**/diagnostics.json
          if-no-files-found: ignore
          include-hidden-files: true
      - uses: actions/upload-artifact@v6
        with:
          name: CodexQuotaScheduler-win32-x64
          path: |
            .release/desktop/CodexQuotaScheduler-win32-x64/
            .release/installer/
          if-no-files-found: error
